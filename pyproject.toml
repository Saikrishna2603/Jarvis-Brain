[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-brain"
version = "0.1.0"
description = "Jarvis brain service. Implementation not yet extracted."
requires-python = ">=3.11"
dependencies = ["jarvis-contracts", "jarvis-platform", "pydantic>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]
